# -------------------------------------------------------
# Railway deployment configuration for Prokejem
# https://docs.railway.app/reference/config-as-code
# -------------------------------------------------------

[build]

[deploy]
# Commande de demarrage. Elle remplace celle saisie dans le tableau de bord
# Railway (la configuration du depot l'emporte toujours).
#   1. migrations ;
#   2. planificateur Laravel en tache de fond, relance s'il s'arrete : sans lui,
#      aucune tache de routes/console.php ne s'execute (expiration des annonces
#      et des boosts, fin des acces Premium offerts, rappels, purges) ;
#   3. serveur web, inchange.
# Les lignes vides et « No scheduled commands » sont filtrees pour ne pas noyer
# le journal : il ne reste que les taches reellement lancees.
# Le site est construit par Railpack : nixpacks.toml n'est pas lu.
startCommand = "php artisan migrate --force && { (while true; do php artisan schedule:work 2>&1 | grep --line-buffered -Ev '^[[:space:]]*$|No scheduled commands'; sleep 10; done) & php artisan serve --host=0.0.0.0 --port=${PORT:-8080}; }"
healthcheckPath = "/up"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
numReplicas = 1
