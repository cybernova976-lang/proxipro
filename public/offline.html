<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4f46e5">
    <title>Hors connexion — Prokejem</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 1.25rem;
            color: #334155;
            background: linear-gradient(145deg, #eef2ff, #f8fafc 50%, #f5f3ff);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
            width: min(100%, 460px);
            padding: clamp(1.5rem, 6vw, 2.5rem);
            border: 1px solid rgba(148, 163, 184, .25);
            border-radius: 28px;
            text-align: center;
            background: rgba(255, 255, 255, .94);
            box-shadow: 0 24px 60px rgba(79, 70, 229, .14);
        }
        img { width: 92px; height: 92px; object-fit: contain; }
        h1 { margin: 1rem 0 .65rem; color: #0f172a; font-size: clamp(1.5rem, 7vw, 2rem); }
        p { margin: 0 auto 1.4rem; max-width: 34ch; line-height: 1.6; }
        button {
            min-height: 48px;
            padding: .8rem 1.15rem;
            border: 0;
            border-radius: 14px;
            color: #fff;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            box-shadow: 0 10px 24px rgba(79, 70, 229, .25);
            font: 700 1rem/1 system-ui, sans-serif;
            cursor: pointer;
        }
        small { display: block; margin-top: 1rem; color: #64748b; }
    </style>
</head>
<body>
    <main>
        <img src="/pwa/icon-192.png" alt="Logo Prokejem">
        <h1>Vous êtes hors connexion</h1>
        <p>Vérifiez votre connexion Internet, puis réessayez pour retrouver Prokejem.</p>
        <button type="button" onclick="window.location.reload()">Réessayer</button>
        <small>Cette page reste disponible même sans réseau.</small>
    </main>
    <script>
        window.addEventListener('online', () => window.location.reload());
    </script>
</body>
</html>
